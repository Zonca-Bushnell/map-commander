<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispatch Map Viewer</title>
    <link rel="stylesheet" href="./viewer.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="viewer-scene"></canvas>
    <div class="hud">
      <strong>DISPATCH MAP VIEWER</strong>
      <span id="viewer-status">初始化中...</span>
    </div>
    <div class="controls">
      <button data-camera="dispatch">Dispatch</button>
      <button data-camera="topdown">Topdown</button>
      <button data-camera="lowOblique">Low Oblique</button>
      <button data-camera-mode="orbit">旋转模式</button>
      <button data-camera-mode="pan">平移模式</button>
      <button data-action="toggle-labels">名称/箭头</button>
      <button data-action="reset">重置视角</button>
    </div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
